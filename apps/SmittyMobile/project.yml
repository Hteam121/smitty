name: Smitty
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.2"

# Your Apple team and bundle id prefix live in Local.xcconfig (git-ignored), not here:
# copy Local.xcconfig.example to Local.xcconfig and fill it in. Config.xcconfig holds the defaults.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
fileGroups:
  - Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Smitty:
    type: application
    platform: iOS
    sources:
      - path: Smitty
      - path: Shared
    dependencies:
      - target: SmittyWatch
    info:
      path: Smitty/Info.plist
      properties:
        CFBundleDisplayName: Smitty
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Smitty listens only while the mic in Chat is on, to turn your words into a message.
        NSSpeechRecognitionUsageDescription: Dictated messages are transcribed to text before they are sent to Smitty.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SMITTY_BUNDLE_PREFIX).smitty
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  SmittyWatch:
    type: application
    platform: watchOS
    sources:
      - path: SmittyWatch
      - path: Shared
    info:
      path: SmittyWatch/Info.plist
      properties:
        CFBundleDisplayName: Smitty
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(SMITTY_BUNDLE_PREFIX).smitty
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SMITTY_BUNDLE_PREFIX).smitty.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES

schemes:
  Smitty:
    build:
      targets:
        Smitty: all
    run:
      config: Debug
  SmittyWatch:
    build:
      targets:
        SmittyWatch: all
    run:
      config: Debug

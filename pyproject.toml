[project]
name = "smitty"
version = "0.1.0"
description = "Smitty: a local voice assistant for Claude Code (reSpeaker XVF3800 + Apple Silicon)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "claude-agent-sdk>=0.2.168",
    "huggingface-hub>=2.2.0",
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3",
    "numpy>=1.26",
    "openwakeword>=0.4.0",
    "pyusb>=1.3.1",
    "sounddevice>=0.5",
]

[project.scripts]
smitty = "smitty.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smitty"]

[dependency-groups]
dev = [
    "onnx>=1.23.2",
]
